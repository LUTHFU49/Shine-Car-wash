{% if profile.wallet_balance > 0 %}
<div class="mt-4 pt-4 border-t border-slate-700">
  <p class="text-xs text-gray-500 mb-2">Loyalty wallet balance: <span class="font-semibold text-white">KSh {{ profile.wallet_balance|floatformat:2 }}</span></p>
  <form method="post" action="{% url 'loyalty:pay_with_wallet' booking.public_id %}" class="flex gap-2">
    {% csrf_token %}
    <input type="number" name="amount" step="0.01" min="1" max="{{ profile.wallet_balance }}" placeholder="Amount"
           class="flex-1 rounded-lg border border-slate-700 bg-slate-900/60 px-3 py-2 text-sm text-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none">
    <button type="submit" class="text-xs font-semibold text-white px-4 py-2 rounded-lg bg-blue-500 whitespace-nowrap">
      <i class="fa-solid fa-wallet mr-1"></i> Pay with Wallet
    </button>
  </form>
</div>
{% endif %}

<div class="mt-4 pt-4 border-t border-slate-700">
  <form method="post" action="{% url 'loyalty:apply_coupon' booking.public_id %}" class="flex gap-2">
    {% csrf_token %}
    <input type="text" name="code" placeholder="Promo code"
           class="flex-1 rounded-lg border border-slate-700 bg-slate-900/60 px-3 py-2 text-sm text-white uppercase focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none">
    <button type="submit" class="text-xs font-semibold text-gray-500 hover:text-white border border-slate-700 px-4 py-2 rounded-lg whitespace-nowrap">
      Apply Coupon
    </button>
  </form>
</div>
