{% extends 'base.html' %}
{% block title %}Error 403 — {{ SITE_NAME }}{% endblock %}
{% block content %}
<section class="py-32">

    <p class="font-mono text-6xl font-semibold text-gradient-brand mb-4">403</p>
    <h1 class="font-display font-bold text-2xl text-ink dark:text-white mb-3">You don't have permission to view this page</h1>
