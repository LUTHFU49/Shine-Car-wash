{% load static %}
<div class="no-print flex flex-wrap items-end justify-between gap-3 mb-6">
  <form method="get" class="flex flex-wrap items-end gap-3">
    <div>
      <label class="block text-xs font-medium text-gray-500 mb-1.5">From</label>
      {{ form.start }}
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-500 mb-1.5">To</label>
      {{ form.end }}
    </div>
    <button type="submit" class="text-xs font-semibold text-white px-4 py-2.5 rounded-lg bg-gradient-to-r from-blue-500 to-pink-500">Apply</button>
    {% for error in form.non_field_errors %}<p class="text-xs text-pink-400 w-full">{{ error }}</p>{% endfor %}
  </form>
  <div class="flex flex-wrap items-center gap-2">
    <a href="{% url export_url_name %}?start={{ start|date:'Y-m-d' }}&end={{ end|date:'Y-m-d' }}&format=csv" class="text-xs font-medium text-gray-500 hover:text-white border border-slate-700 rounded-lg px-3 py-2"><i class="fa-solid fa-file-csv mr-1"></i> CSV</a>
    <a href="{% url export_url_name %}?start={{ start|date:'Y-m-d' }}&end={{ end|date:'Y-m-d' }}&format=excel" class="text-xs font-medium text-gray-500 hover:text-white border border-slate-700 rounded-lg px-3 py-2"><i class="fa-solid fa-file-excel mr-1"></i> Excel</a>
    <a href="{% url export_url_name %}?start={{ start|date:'Y-m-d' }}&end={{ end|date:'Y-m-d' }}&format=pdf" class="text-xs font-medium text-gray-500 hover:text-white border border-slate-700 rounded-lg px-3 py-2"><i class="fa-solid fa-file-pdf mr-1"></i> PDF</a>
    <button type="button" onclick="window.print()" class="text-xs font-medium text-gray-500 hover:text-white border border-slate-700 rounded-lg px-3 py-2"><i class="fa-solid fa-print mr-1"></i> Print</button>
  </div>
</div>
