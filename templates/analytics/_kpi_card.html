<div class="rounded-2xl bg-slate-800 border border-slate-700 p-5">
  <p class="text-xs text-gray-500 mb-1">{{ label }}</p>
  <p class="font-display font-bold text-xl text-white mb-1">{{ prefix }}{{ kpi.current|floatformat:0 }}</p>
  {% if kpi.delta_pct is not None %}
  <p class="text-xs font-medium inline-flex items-center gap-1
    {% if kpi.direction == 'up' %}text-green-400{% elif kpi.direction == 'down' %}text-pink-400{% else %}text-gray-500{% endif %}">
    <i class="fa-solid {% if kpi.direction == 'up' %}fa-arrow-trend-up{% elif kpi.direction == 'down' %}fa-arrow-trend-down{% else %}fa-minus{% endif %}"></i>
    {{ kpi.delta_pct|floatformat:1 }}%
  </p>
  {% else %}
  <p class="text-xs text-gray-500">No prior data to compare</p>
  {% endif %}
</div>
