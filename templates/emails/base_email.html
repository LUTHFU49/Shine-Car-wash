{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ SITE_NAME }}</title>
</head>
<body style="margin:0; padding:0; background-color:#F5F6FB; font-family: Arial, Helvetica, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5F6FB; padding: 32px 16px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" style="max-width:560px; background-color:#FFFFFF; border-radius:16px; overflow:hidden; border:1px solid #E4E7F1;" cellpadding="0" cellspacing="0">

        <!-- Header -->
        <tr>
          <td style="background: linear-gradient(90deg, #0013DE 0%, #FF0090 100%); padding: 28px 32px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="font-size:20px; font-weight:bold; color:#ffffff; font-family: Arial, Helvetica, sans-serif;">
                  {{ SITE_NAME }}
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Body -->
        <tr>
          <td style="padding: 36px 32px; color:#0B1120;">
            {% block email_body %}{% endblock %}
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="padding: 24px 32px; background-color:#F5F6FB; border-top:1px solid #E4E7F1;">
            <p style="margin:0 0 4px 0; font-size:12px; color:#4B5468; font-family: Arial, Helvetica, sans-serif;">
              &copy; {% now "Y" %} {{ SITE_NAME }}. All rights reserved.
            </p>
            <p style="margin:0; font-size:12px; color:#4B5468; font-family: Arial, Helvetica, sans-serif;">
              Developed by {{ COMPANY_NAME }}
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
